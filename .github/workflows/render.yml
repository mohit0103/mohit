# Shared job: write (or load) a script, render the video, deliver it.
name: Render

on:
  workflow_call:
    inputs:
      topic: {type: string, default: ''}
      script: {type: string, default: ''}
      voice: {type: string, default: ''}
      theme: {type: string, default: 'ink'}
      trending: {type: boolean, default: false}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: fact-videos
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE: ${{ vars.ELEVENLABS_VOICE }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'auto' }}
      CHANNEL: ${{ vars.CHANNEL || 'factloop' }}
      VOICE: ${{ inputs.voice || vars.VOICE }}
      THEME: ${{ inputs.theme }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: fact-videos/requirements.txt

      - uses: actions/cache@v4
        with:
          path: fact-videos/.cache
          key: assets-v1

      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libegl1 libgl1
          pip install -r requirements.txt

      - name: Write script
        env:
          TOPIC: ${{ inputs.topic }}
          SCRIPT_IN: ${{ inputs.script }}
          TRENDING: ${{ inputs.trending }}
        run: |
          if [ "$TRENDING" = "true" ]; then
            path=$(python write_script.py --trending | tail -1)
          elif [ -n "$TOPIC" ]; then
            path=$(python write_script.py "$TOPIC" | tail -1)
          else
            path="$SCRIPT_IN"
          fi
          echo "SCRIPT=$path" >> "$GITHUB_ENV"
          echo "NAME=$(basename "$path" .yaml)" >> "$GITHUB_ENV"
          { echo '## Script'; echo '```yaml'; cat "$path"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Render video
        run: python make_video.py "$SCRIPT" -o "output/$NAME.mp4" --preview

      - name: Publish to the "videos" release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Fact videos" --notes "Rendered fact videos."
          gh release upload videos "fact-videos/output/$NAME.mp4" "fact-videos/output/$NAME-preview.png" --clobber
          base="https://github.com/${{ github.repository }}/releases/download/videos"
          echo "VIDEO_URL=$base/$NAME.mp4" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=$base/$NAME-preview.png" >> "$GITHUB_ENV"
          { echo "## Video"; echo "[Download $NAME.mp4]($base/$NAME.mp4)"; echo; echo "![preview]($base/$NAME-preview.png)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save script to repo
        working-directory: .
        run: |
          git config user.name "fact-video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fact-videos/scripts
          git diff --cached --quiet || (git commit -m "Add script: $NAME" && git push) || echo "Could not save script (non-fatal)"

      - name: Hand over (GitHub issue + optional Telegram)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd fact-videos && python - <<'PY' > ../post.md && cd ..
          import os, yaml
          s = yaml.safe_load(open(os.environ['SCRIPT']))
          print(f"## 🎬 {s.get('topic') or os.environ['NAME']}\n")
          print(f"**▶️ [Download the video]({os.environ['VIDEO_URL']})**\n")
          print(f"![preview]({os.environ['PREVIEW_URL']})\n")
          print("### Caption to post\n```")
          print(s.get('post_caption', ''))
          print(' '.join(s.get('hashtags', [])))
          print("```\n### Script")
          for i, sc in enumerate(s['scenes'], 1):
              print(f"{i}. {sc['say']}")
          if s.get('sources'):
              print("\n### Sources (check before posting)")
              for src in s['sources']:
                  print(f"- {src}")
          cred = f"output/{os.environ['NAME']}-credits.txt"
          if os.path.exists(cred):
              print("\n### Photo credits (add to your caption for CC BY photos)")
              for line in open(cred):
                  print(f"- {line.strip()}")
          PY
          gh issue create --title "🎬 $(date +%d-%b) · $NAME" --body-file post.md --assignee "${{ github.repository_owner }}" \
            || gh issue create --title "🎬 $(date +%d-%b) · $NAME" --body-file post.md
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            caption=$(cd fact-videos && python -c "import os,yaml;s=yaml.safe_load(open(os.environ['SCRIPT']));print((s.get('post_caption','')+'\n\n'+' '.join(s.get('hashtags',[])))[:1000])")
            curl -sS -F chat_id="$TELEGRAM_CHAT_ID" -F video=@"fact-videos/output/$NAME.mp4" -F supports_streaming=true \
              -F caption="$caption" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendVideo" > /dev/null && echo "Sent to Telegram"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fact-video
          path: fact-videos/output/
          if-no-files-found: ignore

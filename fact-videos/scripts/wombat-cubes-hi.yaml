post_caption: "Kya aapko pata hai? Duniya ka akela gyaat janwar, jo lagbhag chaukor potty karta hai 🐨🧊 Wo hai wombat, aur is khoj par Georgia Tech ke vaigyaanikon ko 2019 ka Ig Nobel inaam mila. Ye aakaar bahar nahin, aanton ke aakhiri 17% hisse mein banta hai, jahan deewar kahin 4 guna sakht aur kahin lachili hoti hai. Vaigyaanik maante hain ki ye tukde pattharon aur lakdiyon par ludhakte nahin, isliye ilaaka mark karna aasaan hota hai. Aur ek visheshagya ke mutabik, chaukor potty ki meenaarein banana bas afwaah hai 😂 Tumhe ye sunkar hansi aayi ya hairani hui? Comment mein batao 👇"
hashtags: ["#wombat", "#facts", "#science", "#animals", "#ignobel", "#didyouknow", "#hindi", "#reels"]
sources:
  - "Yang et al. (2021), Soft Matter 17(3):475-488, Intestines of non-uniform stiffness mold the corners of wombat feces, DOI 10.1039/d0sm01230k: bare-nosed wombat; cubes are formed within the last 17 percent of the intestine; regions with a four-fold increase in stiffness (and two-fold in thickness); stiffness ratio and flow conditions yield more square shapes"
  - "Ig Nobel Prize in Physics 2019 (Patricia Yang, Alexander Lee, Miles Chan, Alynn Martin, Ashley Edwards, Scott Carver, David Hu); wombats described by National Geographic as the only known animal with cube-shaped droppings"
  - "Territory-marking / not-rolling function is a plausible hypothesis, not proven; wombat expert Mike Swinbourne (University of Adelaide) calls the stacked towers or walls story a misconception (secondary report). Numbers like 80-100 cubes per night were NOT used because they have no primary source"

sources:
- According to FY24 data, minting a ₹1 coin costs ₹1.11.
- An RTI query filed in 2018 stated it takes ₹1.11 to mint a single ₹1 coin.
- The cost of base metals like copper, nickel, and steel has surged globally, impacting India's coin minting expenditure.
- Higher denomination coins like ₹2, ₹5, and ₹10 generally cost less than their face value to produce.
- RBI continues ₹1 coin production to support rural economies, daily wage earners, and retail-level transactions, considering
  their long lifespan makes them cost-efficient in the long run.

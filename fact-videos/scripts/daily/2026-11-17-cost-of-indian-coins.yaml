sources:
- In 2018, an RTI revealed that it costs ₹1.11 to mint a ₹1 coin in India, ₹1.28 for a ₹2 coin, ₹3.69 for a ₹5 coin, and ₹5.54
  for a ₹10 coin.
- Coins have a lifespan of over 20 years, significantly longer than currency notes which last about 9-10 months.
- The continued minting of ₹1 coins helps facilitate small transactions and holds cultural significance, often given as 'shagun'.

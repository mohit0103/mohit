  highlight:
  - Global factors
  - US interest rates
  bg: ink
  layers:
  - type: photo
    query: New York Stock Exchange building exterior, Wall Street
    frame: full
    treatment: duotone
    dim: 0.2
  - type: icon
    name: chart-line
    label: Global Market
    size: 300
    y: 800
- say: So, your necklace's value moves with markets far beyond India's borders.
  highlight:
  - value moves
  - far beyond India
  bg: paper
  layers:
  - type: photo
    query: hand holding gold coin
    frame: print
    treatment: color
  - type: icon
    name: trending-up
    label: Value Fluctuation
    size: 300
    y: 800
- say: Should India reduce its reliance on gold imports? Yes or no?
  highlight:
  - gold imports
  bg: ink
  layers:
  - type: split
    left:
      icon: check
      label: 'YES'
    right:
      icon: x
      label: 'NO'
      accent: true
    y: 900

    size: 140
    y: 800
    accent:
    - BOSS
  - type: stamp
    text: AWAY
    at: away
    y: 1100
    rotate: 8
- say: India consumes almost 800 tonnes of gold yearly. It's a huge national obsession.
  highlight:
  - 800 tonnes
  - obsession
  bg: paper
  layers:
  - type: photo
    query: Indian wedding gold jewelry shop interior
    frame: strip
    treatment: color
  - type: counter
    value: 800
    suffix: ' tonnes'
    label: India's Yearly Demand
    y: 800
- say: 'But here''s the twist: India produces barely 2 tonnes. We import almost everything.'
  highlight:
  - barely 2 tonnes
  - import almost everything
  bg: red
  layers:
  - type: photo
    query: gold bars being loaded into cargo container
    frame: print
    treatment: bw

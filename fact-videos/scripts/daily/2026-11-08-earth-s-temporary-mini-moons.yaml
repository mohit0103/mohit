sources:
- 'Earth has a new mini-moon: a 1-metre space rock named 2026 QQ8 was pulled into orbit around our planet in April, was spotted
  in August, and will stay until about December before drifting off on its own path in 2027.'
- Earth has acquired a temporary companion in space, but it will not stay for long. A small space rock named 2026 QQ8 was
  pulled into Earth's gravitational grip in April 2026, remained unnoticed for months and was first spotted in August.
- The object is estimated to be about 1 metre across, although some estimates put its diameter at 2 metres.
- Earth has caught itself a new mini-moon, and it is sticking around for Christmas. The space rock, designated 2026 QQ8, was
  first observed in August 2026 after entering orbit around Earth in April 2026.
- The mini-moon will remain in the thrall of Earth's gravity through December before breaking away in 2027.
- This is far from the first time Earth has snagged itself a mini-moon, more accurately called a temporary satellite.
- Astronomers have previously identified objects such as 2020 CD3 and 2024 PT5, which spent limited periods in Earth's gravitational
  neighbourhood before moving away.
topic: Earth's Temporary Mini-Moons

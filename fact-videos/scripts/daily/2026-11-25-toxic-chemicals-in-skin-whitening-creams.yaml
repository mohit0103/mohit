scenes:
- say: Your favourite 'fairness' cream hides a deadly poison.
  highlight:
  - deadly poison
  bg: ink
  layers:
  - type: photo
    query: generic fairness cream packaging
    frame: full
    treatment: color
  - type: stamp
    text: DEADLY
    at: deadly
    y: 1080
    rotate: -8
- say: These creams promise quick glow. But mercury is added for fast, cheap skin lightening.
  highlight:
  - mercury
  bg: paper
  layers:
  - type: photo
    query: woman applying face cream close up
    frame: full
    treatment: duotone
  - type: icon
    name: droplet
    label: MERCURY
    size: 300
    y: 800
    at: mercury
- say: It poisons your body! A Kerala teen got kidney damage. Levels were 12,000 times limit.
  highlight:
  - kidney damage
  - 12,000 times
  bg: red
  layers:
  - type: photo
    query: human kidney medical illustration
    frame: full
    treatment: color
  - type: counter
    value: 12500
    suffix: x
    label: times limit
    y: 1000
    plain: false
- say: Indian law bans mercury over one ppm. Yet 7 of 8 creams had thousands of ppm.
  highlight:
  - bans mercury
  - thousands
  bg: ink
  layers:
  - type: photo
    query: online shopping packaging parcel box India
    frame: full
    treatment: bw
  - type: chips
    items:
    - BANNED
    - SOLD ONLINE
    y: 900
    cross: false
- say: Should online sellers be responsible for these banned, toxic creams? Yes or no?
  highlight:
  - responsible
  - banned, toxic creams
  bg: paper
  layers:
  - type: split
    left:
      icon: check
      label: 'YES'
    right:
      icon: x
      label: 'NO'
    y: 900

sources:
- According to FY24 data, minting a ₹1 coin costs ₹1.11, higher than its actual value.
- The average cost to manufacture a one-rupee coin is Rs 1.11, more than its own worth, as per an RTI response from the RBI
  in 2018.
- Coins, unlike notes, can last 20+ years, making them more cost-efficient in the long run despite initial higher production
  costs.
- RBI continues ₹1 coin production to support rural economies, daily wage earners and retail-level transactions.
topic: Indian Rupee Coin Production Cost

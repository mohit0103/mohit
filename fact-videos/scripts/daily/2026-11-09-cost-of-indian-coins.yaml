  - ₹1 coin
  - more than ₹1
  bg: ink
  layers:
  - type: photo
    query: Indian one rupee coin close up
    frame: full
    treatment: color
    dim: 0.2
  - type: stamp
    text: MORE
    at: more
    y: 1080
    rotate: -8
- say: 'An RTI in 2018 revealed: each ₹1 coin costs about ₹1.11 to mint.'

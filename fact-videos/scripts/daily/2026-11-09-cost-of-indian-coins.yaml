  - ₹1.11
  bg: paper
  layers:
  - type: photo
    query: multiple Indian one rupee coins stack
    frame: full
    treatment: color
    dim: 0.2
  - type: counter
    value: 1.11
    suffix: ₹
    label: Mint Cost
    y: 800
- say: 'But here''s the twist: most other coins cost LESS than their value!'
  highlight:
  - twist
  - LESS
  bg: red
  layers:
  - type: photo
    query: mixed Indian coins five ten two rupee
    frame: full
    treatment: color
    dim: 0.2
  - type: stamp
    text: LESS
    at: LESS
    y: 800
    rotate: 5
- say: For instance, a ₹5 coin costs ₹3.69. A ₹10 coin costs ₹5.54.
  highlight:
  - ₹3.69
  - ₹5.54
  bg: ink
  layers:
  - type: photo
    query: Indian five rupee coin, Indian ten rupee coin
    frame: full
    treatment: color
    dim: 0.2
  - type: bars
    items:
    - label: ₹5 Coin
      value: 3.69
    - label: ₹10 Coin
      value: 5.54
    unit: ₹
    y: 800
- say: Government keeps minting them because coins last years, unlike fragile notes.
  highlight:
  - last years
  - fragile notes
  bg: paper
  layers:
  - type: photo
    query: worn Indian currency notes and durable Indian coins
    frame: full
    treatment: bw
    dim: 0.2
  - type: icon
    name: hourglass
    label: Longer Life
    size: 300
    y: 800
- say: This durability saves lakhs in replacement costs, proving efficient long-term.
  highlight:
  - lakhs
  - saves
  bg: ink
  layers:
  - type: photo
    query: Indian Government Mint machine currency production
    frame: full
    treatment: color
    dim: 0.2
  - type: icon
    name: currency-rupee
    label: Cost Savings
    size: 300
    y: 800

  highlight:
  - half
  - unpredictable
  bg: ink
  layers:
  - type: photo
    query: Indian farmers looking at sky monsoon fields
    frame: full
    treatment: color
    dim: 0.25
  - type: counter
    value: 50
    suffix: '%'
    label: Farms Reliant
    plain: false
    y: 900

  - 11,872 millimeters
  bg: paper
  layers:
  - type: photo
    query: Mawsynram village rain measurement gauge extreme rain
    frame: full
    treatment: color
    dim: 0.25
  - type: counter
    value: 11872
    suffix: ' mm'
    label: Annual Rainfall
    plain: false
    y: 900

    query: India monsoon flood displacement village
    frame: full
    treatment: color
    dim: 0.25
  - type: stamp
    text: DISPLACED
    at: displacing
    y: 1080
    rotate: 8
- say: Should India invest more in large-scale rainwater harvesting? Yes or No?

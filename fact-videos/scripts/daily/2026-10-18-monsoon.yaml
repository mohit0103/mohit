  - rainwater harvesting
  bg: paper
  layers:
  - type: split
    left:
      icon: check
      label: 'YES'
    right:
      icon: x
      label: 'NO'
      accent: true
    y: 900
post_caption: 'India''s monsoon brings extremes: the world''s wettest place and widespread water scarcity, then devastating

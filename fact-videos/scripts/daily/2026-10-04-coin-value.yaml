channel: factloop
kicker: MONEY · INDIA
theme: ink
voice: en-US-AndrewMultilingualNeural
rate: +10%
pronounce: {}
scenes:
- say: Your ₹1 coin costs *more* than ₹1 to make.
  highlight:
  - more
  bg: ink
  layers:
  - type: photo
    query: Indian one rupee coin close up
    frame: full
    treatment: duotone
    dim: 0.2
  - type: stamp
    text: ₹1 LOSS
    at: more
    y: 1080
    rotate: -8
- say: Each ₹1 coin costs ₹1.11 to mint.
  highlight:
  - ₹1.11
  bg: paper
  layers:
  - type: photo
    query: Indian coins production line
    frame: print
    treatment: color
    dim: 0.15
  - type: counter
    value: 1.11
    suffix: ₹
    label: Cost to Mint
    y: 800
- say: Since 2018, government loses money on every single ₹1 coin.
  highlight:
  - loses money
  bg: ink
  layers:
  - type: photo
    query: Indian Government Mint building
    frame: strip
    treatment: bw
    dim: 0.2
  - type: chips
    items:
    - '2018'
    at: '2018'
    y: 1000
- say: However, ₹2, ₹5, and ₹10 coins still cost *less* than their face value.
  highlight:
  - less
  bg: paper
  layers:
  - type: photo
    query: stack of Indian rupee coins
    frame: full
    treatment: duotone
    dim: 0.2
  - type: bars
    items:
    - label: ₹2
      value: 1.28
    - label: ₹5
      value: 3.69
    - label: ₹10
      value: 5.54
    unit: ₹
    y: 900
- say: Yet, ₹1 coins remain essential for countless daily transactions across India.
  highlight:
  - essential
  bg: ink
  layers:
  - type: photo
    query: people counting money India market
    frame: print
    treatment: color
    dim: 0.15
  - type: icon
    name: users
    label: Daily Use
    size: 300
    y: 900
- say: Should India continue minting coins that cost more than their worth?
  highlight:
  - worth
  bg: red
  layers:
  - type: split
    left:
      icon: check
      label: 'YES'
    right:
      icon: x
      label: 'NO'
post_caption: 'Did you know your ₹1 coin is a ''loss-making'' venture for the government? 🤔 What do you think: should we keep
  minting them? Yes or no in the comments!'

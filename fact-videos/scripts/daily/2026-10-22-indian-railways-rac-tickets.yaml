channel: factloop
kicker: TRAIN TRAVEL · FACTS
theme: ink
voice: en-US-AndrewMultilingualNeural
rate: +10%
pronounce:
  RAC: R-A-C
scenes:
- say: Your confirmed train ticket still means sharing your seat with a stranger.
  highlight:
  - sharing
  - stranger
  bg: ink
  layers:
  - type: photo
    query: Indian train side lower berth shared by two people during daytime
    frame: full
    treatment: color
    dim: 0.2
  - type: stamp
    text: SHARED!
    at: sharing
    y: 1080
    rotate: -8
- say: That's Reservation Against Cancellation, or RAC. Your ticket is half-confirmed.
  highlight:
  - RAC
  - half-confirmed
  bg: paper
  layers:
  - type: photo
    query: Indian Railways PNR status screen showing RAC status on mobile phone
    frame: print
    treatment: duotone
  - type: stamp
    text: HALF CONFIRMED
    at: half-confirmed
    y: 1100
    rotate: 5
- say: Indian Railways allots you a specific side lower berth, shared with another RAC passenger.
  highlight:
  - side lower berth
  - shared
  bg: ink
  layers:
  - type: photo
    query: Two people sharing side lower berth in Indian train compartment, close up
    frame: full
    treatment: color
    dim: 0.2
  - type: kicker
    text: SHARED BERTH
    y: 560
- say: 'The twist: You *can* board, avoiding fines! Much better than waitlist.'
  highlight:
  - board
  - fines
  bg: red
  layers:
  - type: photo
    query: Indian Railways TTE checking ticket in train compartment, traveler showing e-ticket
    frame: full
    treatment: color
    dim: 0.2
  - type: icon
    name: check
    label: NO FINES
    size: 300
    y: 1000
- say: If a berth becomes vacant, your RAC ticket converts to a full confirmed seat.
  highlight:
  - vacant
  - full confirmed
  bg: paper
  layers:
  - type: photo
    query: empty clean Indian train sleeper berth during day
    frame: full
    treatment: color
    dim: 0.2
  - type: stamp
    text: UPGRADE!
    at: converts
    y: 1080
    rotate: -8
- say: Should RAC passengers get a guaranteed full berth, or is sharing fair? Yes or no?
  highlight: []
  bg: ink
  layers:
  - type: split
    left:
      icon: check
      label: Full Berth
    right:
      icon: x
      label: Shared Fair
      accent: true
post_caption: Ever wondered about RAC tickets on Indian Railways? It's a lifesaver for many, but comes with a shared seat.
  What's your take? Should RAC passengers always get a full berth, or is sharing fair? Let us know in the comments – Yes or
  No!

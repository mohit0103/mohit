channel: factloop
kicker: CRICKET · UNIQUE RECORDS
theme: ink
voice: en-US-AndrewMultilingualNeural
rate: +10%
pronounce:
  Unadkat: Oo-nad-cut
  Saurashtra: Saw-rash-tra
  Syed Mushtaq Ali Trophy: Sai-ed Moo-sh-tak Ah-lee Tro-fee
scenes:
- say: This bowler holds a world record, batting at number 11!
  highlight:
  - bowler
  - world record
  bg: ink
  layers:
  - type: photo
    query: cricket batsman number 11 T20
    frame: full
    treatment: color
    dim: 0.15
  - type: headline
    text: RECORD BATTING
    font: display
    size: 140
    y: 600
    accent:
    - RECORD
  - type: stamp
    text: NO. 11
    at: number 11
    y: 1080
    rotate: -8
- say: That's Indian pacer Jaydev Unadkat. His career is full of twists.
  highlight:
  - Jaydev Unadkat
  - twists
  bg: paper
  layers:
  - type: photo
    query: Jaydev Unadkat bowling action
    frame: print
    treatment: color
    y: 900
  - type: icon
    name: bolt
    label: FAST BOWLER
    size: 200
    y: 580
- say: For Saurashtra, he smashed 40 runs off just 26 balls in the Syed Mushtaq Ali Trophy.
  highlight:
  - 40 runs
  - 26 balls
  bg: ink
  layers:
  - type: photo
    query: cricket stadium lights night India
    frame: full
    treatment: duotone
    dim: 0.25
  - type: counter
    value: 40
    suffix: ' RUNS'
    label: No. 11 Scored
    y: 900
- say: He became the highest No. 11 batter in men's T20 history, adding a 62-run partnership!
  highlight:
  - highest No. 11
  - 62-run partnership
  bg: paper
  layers:
  - type: photo
    query: cricket batsmen celebrating partnership
    frame: strip
    treatment: color
    y: 700
  - type: stamp
    text: WORLD RECORD
    at: history
    y: 1100
    rotate: 5
- say: 'The twist? Unadkat also holds India''s record for longest Test match gap: 12 years!'
  highlight:
  - longest Test match gap
  - 12 years
  bg: red
  layers:
  - type: photo
    query: old cricket scorebook pages
    frame: full
    treatment: bw
    dim: 0.2
  - type: ghost
    text: 12 YEARS
    y: 1000
  - type: stamp
    text: 118 TESTS
    at: gap
    y: 600
    rotate: -10
- say: Should players with unique careers, like Unadkat's, be celebrated more? Yes or No?
  highlight:
  - celebrated more
  bg: ink
  layers:
  - type: split
    left:
      icon: check
      label: 'YES'
    right:
      icon: x
      label: 'NO'
      accent: true
    y: 900
  - type: icon
    name: bulb
    label: YOUR TAKE
    size: 180
    y: 550
post_caption: Jaydev Unadkat's journey is truly one-of-a-kind! From a historic T20 batting record at No. 11 to a 12-year Test
  comeback. Should such unique careers be celebrated more? Let us know your thoughts below! 👇

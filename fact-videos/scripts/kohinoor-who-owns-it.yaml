sources:
- 'Treaty of Lahore (1849): the Koh-i-Noor surrendered to the British; Maharaja Duleep Singh was 10'
- 'Royal Collection Trust / Historic Royal Palaces: recut in 1852 from about 186 to 105.6 carats; now in the Crown of Queen Elizabeth The Queen Mother, Tower of London'
- Claims by India, Pakistan and Afghanistan; UK has repeatedly said it will not return it (e.g. PM David Cameron, 2010 and 2013)
- 'Buckingham Palace, 2023: Queen Camilla crowned with Queen Mary''s Crown; the Koh-i-Noor was not used'

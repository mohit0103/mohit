<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Bricolage'; font-weight: 800; src: url('vendor/bricolage-grotesque-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family: 'Bricolage'; font-weight: 600; src: url('vendor/bricolage-grotesque-latin-600-normal.woff2') format('woff2'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111; }
body { font-family: 'Bricolage', sans-serif; font-weight: 800; color: #111; -webkit-font-smoothing: antialiased; }
#app { position: absolute; inset: 0; overflow: hidden; }
.scene { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
.stage { position: absolute; inset: 0; transform-origin: 50% 45%; }
.sticker { position: absolute; z-index: 1; }
.sticker svg { width: 100%; height: 100%; overflow: visible; }
.abs { position: absolute; }
.center { left: 50%; top: 50%; transform: translate(-50%, -50%); }
/* chunky card */
.card { position: absolute; white-space: nowrap; background: #c6ff3d; border: 7px solid #111; border-radius: 34px; box-shadow: 14px 14px 0 #111;
        padding: 26px 40px; font-size: 92px; line-height: 0.98; text-align: center; letter-spacing: -1.5px; z-index: 5; }
.card .hl { background: #ff4fd8; border: 6px solid #111; border-radius: 16px; padding: 0 14px; display: inline-block; box-shadow: 6px 6px 0 #111; }
.label { position: absolute; font-size: 44px; letter-spacing: 1px; text-transform: uppercase; background: #111; color: #fff;
         border-radius: 999px; padding: 10px 30px; z-index: 6; }
.big { position: absolute; font-size: 260px; line-height: 0.9; letter-spacing: -8px; color: #fff;
       -webkit-text-stroke: 14px #111; paint-order: stroke fill; text-shadow: 14px 14px 0 #111; z-index: 5; }
.ill { position: absolute; z-index: 4; overflow: visible; }
.ill svg { overflow: visible; }
/* captions */
#captions { position: absolute; left: 0; right: 0; top: 1430px; height: 260px; z-index: 900; }
.chunk { position: absolute; left: 40px; right: 40px; top: 0; text-align: center; visibility: hidden; }
.cbox { display: inline-block; background: #fff; border: 7px solid #111; border-radius: 30px; box-shadow: 11px 11px 0 #111;
        padding: 10px 18px 14px; font-size: 80px; line-height: 1.1; letter-spacing: -1px; white-space: nowrap; }
.chunk .w { display: inline-block; color: #111; padding: 2px 12px; margin: 0 1px; border-radius: 16px; }
.chunk .w.hl { background: #ff4fd8; border: 5px solid #111; padding: 0 10px; }
#chip { position: absolute; left: 56px; top: 70px; z-index: 950; background: #fff; border: 6px solid #111; border-radius: 999px;
        padding: 6px 26px; font-size: 42px; box-shadow: 6px 6px 0 #111; letter-spacing: -0.5px; }
#chip span { color: #ff4fd8; }
#progress { position: absolute; left: 56px; right: 56px; top: 34px; height: 14px; background: rgba(0,0,0,0.25); border-radius: 99px; z-index: 950; overflow: hidden; }
#progress div { height: 100%; background: #fff; border-right: 4px solid #111; }
</style>
</head>
<body>
<div id="app"></div>
<script>window.DATA = __DATA__;</script>
<script src="vendor/gsap.min.js"></script>
<script>__REEL__</script>
<script src="engine.js"></script>
</body>
</html>

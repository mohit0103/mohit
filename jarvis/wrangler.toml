name = "jarvis"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "jarvis"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
CITY = "Bengaluru"
CITY_LAT = "12.9716"
CITY_LON = "77.5946"
TTS_SPEAKER = "apollo"
TTS_DAILY_CHARS = "3000"

[observability]
enabled = true

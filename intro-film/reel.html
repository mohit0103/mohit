<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mohit Bhaisare — Reel</title>
<link rel="stylesheet" href="assets/fonts/inter-display.css">
<style>
  :root {
    --white: #ffffff; --black: #000000; --gray-bg: #f5f5f7; --label: #1d1d1f; --label2: #6e6e73; --label3: #86868b;
    --amber: #ad6e52; --font: 'Inter Display', -apple-system, 'SF Pro Display', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  body.preview { display: grid; place-items: center; height: 100vh; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--black); color: var(--white);
    transform-origin: 0 0; font-family: var(--font); -webkit-font-smoothing: antialiased; font-optical-sizing: auto;
    font-feature-settings: 'cv11', 'ss03'; }
  .layer { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .c { left: 0; width: 1080px; text-align: center; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .ph { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .t-head { font-weight: 600; letter-spacing: -.035em; line-height: 1.04; white-space: nowrap; }
  .t-body { font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
  .w { display: inline-block; will-change: transform, filter, opacity; }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; mix-blend-mode: overlay; opacity: .07; pointer-events: none; }
  #vig { background: radial-gradient(ellipse 95% 72% at 50% 50%, transparent 55%, rgba(0,0,0,.42) 100%); }
  .grad { padding-bottom: .12em; background: linear-gradient(100deg, #ffe3cf 0%, #f2b48d 45%, #c97b5a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div id="stage">
  <!-- light canvas used by the Google + portrait scenes -->
  <div class="layer" id="lightBg" style="background:var(--gray-bg)"></div>

  <!-- intro -->
  <div class="layer" id="intro">
    <div class="abs c t-head" id="iTitle" style="top:900px;font-size:44px"></div>
    <div class="abs c t-body" id="iSub" style="top:968px;font-size:22px;color:var(--label3)">Photography</div>
    <div class="abs" id="iDot" style="border-radius:50%;background:#fff"></div>
  </div>

  <!-- match-cut shots -->
  <div class="layer" id="shots"></div>
  <svg id="fxSvg" width="1080" height="1920">
    <circle id="ring" cx="540" cy="960" r="0" fill="none" stroke="#fff" stroke-width="2" opacity="0"/>
    <line id="lineA" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="2" opacity="0"/>
    <line id="lineB" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="2" opacity="0"/>
  </svg>

  <!-- type beat -->
  <div class="layer" id="beat">
    <div class="abs c t-body" id="bA" style="top:842px;font-size:50px;color:var(--label3)"></div>
    <div class="abs c t-head" id="bB" style="top:906px;font-size:118px;padding-bottom:14px"></div>
  </div>

  <!-- Google × photo -->
  <div class="layer" id="google">
    <svg id="gMark" viewBox="0 0 48 48" width="150" height="150" style="left:465px;top:250px">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <div class="abs c" id="gX" style="top:436px;font-size:64px;font-weight:250;color:var(--label3);line-height:1">×</div>
    <div class="layer" id="cards"></div>
    <div class="abs c t-body" id="gL1" style="top:1468px;font-size:30px;color:var(--label2)">Featured on</div>
    <div class="abs c t-head" id="gL2" style="top:1514px;font-size:60px;color:var(--label)">Google Pixel <span style="color:var(--label3);font-weight:400">&amp;</span> Google India</div>
    <div class="abs c t-body" id="gL3" style="top:1622px;font-size:27px;color:var(--label2)"><span id="gNum" style="color:var(--label);font-weight:600">300K+</span> views on a single frame</div>
  </div>

  <!-- portrait -->
  <div class="layer" id="portrait">
    <div class="layer" id="pFerrisWrap"><img class="ph" id="pFerris" src="assets/photos/featured-pixel-02.jpg"></div>
    <div class="layer" id="pWrap"><img class="ph" id="pImg" src="assets/photos/mohit-portrait.png"></div>
    <svg id="pSvg" width="1080" height="1920">
      <circle id="pRing" cx="540" cy="760" r="434" fill="none" stroke="#1d1d1f" stroke-width="1.5"/>
      <defs><path id="pPath" d="M 540 760 m -478 0 a 478 478 0 1 1 956 0 a 478 478 0 1 1 -956 0"/></defs>
      <g id="pBadge"><text font-family="Inter Display" font-weight="600" font-size="17" letter-spacing="6" fill="#86868b"><textPath href="#pPath">THIRD_EYEF1.7 · PHOTOGRAPHER · BANGALORE · THIRD_EYEF1.7 · PHOTOGRAPHER · BANGALORE · THIRD_EYEF1.7 · PHOTOGRAPHER · BANGALORE · THIRD_EYEF1.7 ·</textPath></text></g>
    </svg>
    <div class="abs c t-head" id="pName" style="top:1300px;font-size:92px;color:var(--label)"></div>
    <div class="abs c t-body" id="pRole" style="top:1420px;font-size:32px;color:var(--label2)"></div>
  </div>

  <!-- recap + end -->
  <div class="layer" id="recap"></div>
  <div class="layer" id="end">
    <div class="abs c t-head" id="eTitle" style="top:860px;font-size:88px"></div>
    <div class="abs c t-body" id="eSub" style="top:980px;font-size:28px;color:var(--label3)">Mohit Bhaisare — Photography</div>
    <div class="abs c t-body" id="eUrl" style="top:1030px;font-size:23px;color:var(--label2)">mohit-bhaisare.vercel.app</div>
  </div>

  <!-- overlays -->
  <div class="abs c t-body" id="eyebrow" style="top:96px;font-size:22px;font-weight:600;letter-spacing:.01em;color:rgba(255,255,255,.86)">third_eyef1.7</div>
  <div class="abs c t-head" id="word" style="top:1612px;font-size:72px;text-shadow:0 2px 30px rgba(0,0,0,.25)"></div>
  <div class="layer" id="vig"></div>
  <canvas id="grain" width="540" height="960"></canvas>
</div>

<script>
'use strict';
const W = 1080, H = 1920, FPS = 60;
window.STAGE = { w: W, h: H };
window.SCORE = 'reel_score.py';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const lerpLog = (a, b, p) => a * Math.pow(b / a, p);
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x, outCubic: x => 1 - (1 - x) ** 3, inCubic: x => x ** 3, inQuad: x => x * x,
  inOutCubic: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  outQuart: x => 1 - (1 - x) ** 4, inOutQuart: x => x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2,
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - (-2 * x + 2) ** 5 / 2,
  outExpo: x => x >= 1 ? 1 : 1 - 2 ** (-10 * x), inExpo: x => x <= 0 ? 0 : 2 ** (10 * x - 10),
  outBack: x => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2, inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
};
const EP = (t, a, b, e = E.inOutCubic) => e(P(t, a, b));
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const show = (el, on) => { (typeof el === 'string' ? $(el) : el).style.display = on ? '' : 'none'; };
function S(el, o) {
  if (typeof el === 'string') el = $(el);
  for (const k in o) { const v = o[k];
    if (k === 'o') el.style.opacity = v; else if (k === 'tf') el.style.transform = v;
    else if (k === 'clip') el.style.clipPath = v; else el.style[k] = v; }
}
function setMask(el, m) { el.style.webkitMaskImage = m; el.style.maskImage = m; }
let FRAME = 0;

// words that blur-sharpen into place (Apple keynote style)
function words(el) {
  const txt = el.textContent || el.dataset.text; el.innerHTML = '';
  return txt.split(' ').map((w, i, a) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w;
    el.appendChild(s); if (i < a.length - 1) el.appendChild(document.createTextNode(' ')); return s; });
}
function blurIn(pieces, t, a, st = .06, dur = .45, b = Infinity, bd = .25) {
  pieces.forEach((el, i) => {
    const pin = E.outCubic(P(t, a + i * st, a + i * st + dur)), pout = b === Infinity ? 0 : E.inCubic(P(t, b + i * st * .4, b + i * st * .4 + bd));
    el.style.opacity = pin * (1 - pout);
    el.style.filter = `blur(${(1 - pin) * 14 + pout * 12}px)`;
    el.style.transform = `translateY(${(1 - pin) * 26 - pout * 16}px) scale(${lerp(1.06, 1, pin)})`;
  });
}

/* ───────────────────────── shots ─────────────────────────
   Each shot is placed by a feature (x, y, r in image pixels). A transition into
   a shot has an anchor A = screen circle (cx, cy, R): the outgoing shot's
   feature and the incoming shot's feature are both mapped onto it, so at the
   cut they coincide exactly. Between its in and out anchors a shot keeps moving
   (constant-rate zoom + drift), so the camera never stops. */
const SH = [
  { src: 'photo-01.jpg', at: 1.0, tin: 'circle', fin: [633, 425, 92], A: [540, 990, 225], word: 'See.' },
  { src: 'photo-05.jpg', at: 1.5, tin: 'circle', fin: [950, 548, 131], A: [540, 990, 240], word: 'Moon.' },
  { src: 'photo-16.jpg', at: 2.0, tin: 'circle', fin: [1103, 782, 117], A: [540, 1245, 300], word: 'Sun.' },
  { src: 'photo-20.jpg', at: 2.5, tin: 'circle', fin: [945, 1695, 171], A: [540, 1245, 270], word: 'Wheel.' },
  { src: 'featured-pixel-02.jpg', at: 3.0, tin: 'circle', fin: [1077, 1535, 117], A: [540, 1100, 112], word: 'Wonder.' },
  { src: 'photo-14.jpg', at: 3.5, tin: 'circle', fin: [953, 537, 53], A: [540, 1150, 113], outA: [540, 1150, 127], word: 'Bloom.' },
  { src: null, at: 4.5, tin: 'irisOut' },
  { src: 'photo-31.jpg', at: 5.5, tin: 'slit', fin: [1280, 2450, 100], A: [540, 1350, 85], slitY: 2096, word: 'Blue hour.' },
  { src: 'photo-04.jpg', at: 6.0, tin: 'axis', fin: [960, 2700, 100], fout: [960, 2240, 100], A: [540, 1350, 85], word: 'Stillness.' },
  { src: 'photo-13.jpg', at: 6.5, tin: 'horizon', fin: [960, 2234, 100], A: [540, 959, 85], word: 'Amber.' },
  { src: 'photo-28.jpg', at: 7.0, tin: 'horizon', fin: [960, 2191, 100], A: [540, 959, 85], word: 'Horizon.' },
  { src: 'photo-22.jpg', at: 7.5, tin: 'horizon', fin: [1320, 1985, 100], A: [540, 959, 135], outS: 2.5, word: 'Lines.' },
  { src: 'featured-pixel-03.jpg', at: 8.25, tin: 'vp', fin: [960, 1205, 100], A: [540, 959, 85], outA: [540, 959, 85] },
  { src: null, at: 9.0, tin: 'cut' },
];
// transition window: [length, fraction before the cut]
const TR = { circle: [.45, .18], irisOut: [.35, .6], slit: [.42, .05], axis: [.42, .25], horizon: [.42, .25], vp: [.5, .3], cut: [0, 0] };
const CAM_C = [540, 959];
const cam = t => t < 5.5 ? 1 : 1 + .035 * (Math.min(t, 7.5) - 5.5);   // slow push through the horizon chain

const shotEls = SH.map(s => {
  if (!s.src) return null;
  const d = document.createElement('div'); d.className = 'shot';
  const img = document.createElement('img'); img.className = 'ph'; img.src = `assets/photos/${s.src}`;
  d.appendChild(img); $('shots').appendChild(d); return { d, img };
});
// placement of shot i at time t (screen-space scale s and the screen position of its in-feature)
function placement(i, t) {
  const s = SH[i], n = SH[i + 1];
  const fin = s.fin, fout = s.fout || s.fin;
  const sIn = s.A[2] / fin[2];
  const pIn = [s.A[0] - fin[0] * sIn, s.A[1] - fin[1] * sIn];           // image translation at the in-cut
  const oa = s.outA || (n && n.A && n.src && n.tin !== 'vp' ? n.A : null);
  let sOut = sIn, pOut = pIn;
  if (s.outS) { sOut = s.outS; pOut = [s.A[0] - fin[0] * sOut, s.A[1] - fin[1] * sOut]; }
  else if (oa) { sOut = oa[2] / fout[2]; pOut = [oa[0] - fout[0] * sOut, oa[1] - fout[1] * sOut]; }
  const t1 = n ? n.at : s.at + 1;
  let p = (t - s.at) / (t1 - s.at);                                      // linear and unclamped: motion carries through cuts…
  if ((p > 1 && sOut < sIn) || (p < 0 && sOut > sIn)) p = clamp(p);      // …but only ever as a push-in, never exposing an edge
  const sc = lerpLog(sIn, sOut, p);
  // keep the in-feature on a straight path between its in and out screen positions
  const fxIn = s.A[0], fyIn = s.A[1];
  const fxOut = pOut[0] + fin[0] * sOut, fyOut = pOut[1] + fin[1] * sOut;
  let fx = lerp(fxIn, fxOut, p), fy = lerp(fyIn, fyOut, p);
  let tx = fx - fin[0] * sc, ty = fy - fin[1] * sc;
  // camera
  const k = cam(t);
  return { s: sc * k, tx: CAM_C[0] + (tx - CAM_C[0]) * k, ty: CAM_C[1] + (ty - CAM_C[1]) * k };
}
const featScreen = (pl, f) => [pl.tx + f[0] * pl.s, pl.ty + f[1] * pl.s, f[2] * pl.s];
function drawShot(i, t, o = {}) {
  const el = shotEls[i]; if (!el) return null;
  let pl = placement(i, t);
  if (o.mul) { const f = featScreen(pl, SH[i].fin); pl = { s: pl.s * o.mul, tx: f[0] - SH[i].fin[0] * pl.s * o.mul, ty: f[1] - SH[i].fin[1] * pl.s * o.mul }; }
  el.d.style.display = ''; el.d.style.zIndex = o.z || 0; el.d.style.opacity = o.op ?? 1;
  el.img.style.transform = `translate(${pl.tx}px,${pl.ty}px) scale(${pl.s})`;
  setMask(el.d, o.mask || 'none');
  el.img.style.filter = o.filter || 'none';
  return pl;
}
const ringEl = $('ring'), lineA = $('lineA'), lineB = $('lineB');
function renderShots(t) {
  shotEls.forEach(e => e && (e.d.style.display = 'none'));
  ringEl.setAttribute('opacity', 0); lineA.setAttribute('opacity', 0); lineB.setAttribute('opacity', 0);
  let c = -1; for (let i = 0; i < SH.length; i++) if (t >= SH[i].at) c = i;
  let k = -1, p = 0;
  for (let i = 0; i < SH.length; i++) {
    const [D, a] = TR[SH[i].tin] || [0, 0]; if (!D) continue;
    const s0 = SH[i].at - D * a;
    if (t >= s0 && t < s0 + D) { k = i; p = (t - s0) / D; }
  }
  if (k < 0) { if (c >= 0 && SH[c].src) drawShot(c, t); return; }
  const B = k, A = k - 1, ty = SH[B].tin;
  const hasA = A >= 0 && !!SH[A].src, hasB = !!SH[B].src;
  if (ty === 'circle') {
    if (hasA) drawShot(A, t);
    const pl = placement(B, t), [x, y, r] = featScreen(pl, SH[B].fin);
    const al = smooth(0, .32, p);
    const grow = E.inOutCubic(P(p, .22, 1));
    const rin = r * lerp(1, 14, grow), f = lerp(3, 90, grow);
    drawShot(B, t, { z: 1, mask: `radial-gradient(circle at ${x}px ${y}px, rgba(0,0,0,${al}) ${rin}px, rgba(0,0,0,0) ${rin + f}px)` });
    ringEl.setAttribute('cx', x); ringEl.setAttribute('cy', y); ringEl.setAttribute('r', rin + f * .3);
    ringEl.setAttribute('opacity', .75 * Math.sin(Math.PI * clamp(p * 1.4)) * (1 - grow * .6));
    ringEl.setAttribute('stroke-width', lerp(2.5, 1, grow));
  } else if (ty === 'irisOut') {
    const pl = placement(A, t), [x, y, r] = featScreen(pl, SH[A].fin);
    const e = E.inOutCubic(p), rin = lerp(r * 14, 0, e), f = lerp(90, 2, e);
    drawShot(A, t, { mask: `radial-gradient(circle at ${x}px ${y}px, #000 ${rin}px, transparent ${rin + f}px)` });
    ringEl.setAttribute('cx', x); ringEl.setAttribute('cy', y); ringEl.setAttribute('r', Math.max(0, rin));
    ringEl.setAttribute('opacity', .7 * smooth(.4, .8, p) * (1 - smooth(.85, 1, p)));
  } else if (ty === 'axis' || ty === 'horizon' || ty === 'slit') {
    if (hasA) drawShot(A, t);
    const pl = placement(B, t);
    const vertical = ty === 'axis';
    const fy = ty === 'slit' ? pl.ty + SH[B].slitY * pl.s : featScreen(pl, SH[B].fin)[1];
    const fx = featScreen(pl, SH[B].fin)[0];
    const e = E.inOutQuart(p), half = (vertical ? W : H) * 1.05 * e, f = lerp(4, 160, e);
    const ctr = vertical ? fx : fy, dir = vertical ? '90deg' : '180deg';
    const m = `linear-gradient(${dir}, transparent ${ctr - half - f}px, #000 ${ctr - half}px, #000 ${ctr + half}px, transparent ${ctr + half + f}px)`;
    drawShot(B, t, { z: 1, mask: m });
    const op = .8 * Math.sin(Math.PI * clamp(p * 1.25)) * (1 - e);
    [[lineA, -1], [lineB, 1]].forEach(([ln, sg]) => {
      const v = ctr + sg * (half + f * .2);
      if (vertical) { ln.setAttribute('x1', v); ln.setAttribute('x2', v); ln.setAttribute('y1', 0); ln.setAttribute('y2', H); }
      else { ln.setAttribute('y1', v); ln.setAttribute('y2', v); ln.setAttribute('x1', 0); ln.setAttribute('x2', W); }
      ln.setAttribute('opacity', op);
    });
  } else if (ty === 'vp') {
    // zoom through the vanishing point: the outgoing shot rushes past, the incoming one grows out of the same point
    if (hasA) drawShot(A, t, { mul: Math.exp(2.2 * E.inQuad(p)), op: 1 - smooth(.55, .95, p), filter: `blur(${smooth(.3, 1, p) * 10}px)` });
    const m = lerp(.32, 1, E.outExpo(P(p, .15, 1)));
    const pl = placement(B, t);
    const sEff = pl.s * m;
    const [x, y] = featScreen(pl, SH[B].fin);
    const rr = sEff < .8 ? 930 * sEff : lerp(744, 2400, smooth(.8, .9, sEff / pl.s * .85));
    drawShot(B, t, { z: 1, mul: m, mask: `radial-gradient(circle at ${x}px ${y}px, #000 ${rr}px, transparent ${rr + 30}px)`, op: smooth(.1, .3, p) });
  } else if (hasB) drawShot(B, t);
}

/* ───────────────────────── other scenes ───────────────────────── */
$('iTitle').textContent = 'third_eyef1.7';
const iTitle = words($('iTitle'));
$('bA').textContent = 'Chasing'; $('bB').textContent = 'the last light.';
const bA = words($('bA')), bB = words($('bB'));
bB.forEach(w => w.classList.add('grad'));   // gradient per word so it survives per-word transforms
$('pName').textContent = 'Mohit Bhaisare'; $('pRole').textContent = 'Photographer, Bangalore.';
const pName = words($('pName')), pRole = words($('pRole'));
$('eTitle').textContent = 'third_eyef1.7';
const eTitle = words($('eTitle'));
const gL1 = words($('gL1'));

// Google cards: the featured frame shrinks from full screen into a card, then the carousel advances
const CARD = { x: 200, y: 560, w: 680, h: 850, r: 44 };
const CARDS = [['featured-pixel-03.jpg', 960, 1205], ['featured-pixel-01.jpg', 960, 1200], ['featured-pixel-02.jpg', 1077, 1535]];
const cardEls = CARDS.map(([src]) => {
  const d = document.createElement('div'); d.className = 'shot';
  const img = document.createElement('img'); img.className = 'ph'; img.src = `assets/photos/${src}`;
  d.appendChild(img); $('cards').appendChild(d); return { d, img };
});
// card framing: image (1920×2400) fills the card exactly
const cardFit = (fx, fy) => { const s = CARD.w / 1920; return { s, x: CARD.x + fx * s, y: CARD.y + fy * s }; };

// recap (four eighth-note cuts) — cover framing
const RECAP = [['photo-31.jpg', .66, .7], ['featured-pixel-03.jpg', .5, .5], ['photo-16.jpg', .57, .72], ['photo-26.jpg', .5, .5]];
const recapEls = RECAP.map(([src, fx, fy]) => {
  const d = document.createElement('div'); d.className = 'shot';
  const img = document.createElement('img'); img.className = 'ph'; img.src = `assets/photos/${src}`;
  d.appendChild(img); $('recap').appendChild(d); return { d, img, fx, fy };
});
function cover(img, m, fx, fy) {
  const iw = img.naturalWidth, ih = img.naturalHeight, s = Math.max(W / iw, H / ih) * m;
  img.style.transform = `translate(${(W - iw * s) * fx}px,${(H - ih * s) * fy}px) scale(${s})`;
}

/* ───────────────────────── timing + sound cues ───────────────────────── */
const T = { beat: 4.5, google: 9.0, swap1: 10.0, swap2: 10.5, expand: 11.0, portrait: 11.5, recap: 14.5, end: 15.0 };
window.DURATION = 17.2;
window.SECTIONS = { intro: [0, 1], m1: [1, 4.5], brk: [4.5, 5.5], bands: [5.5, 7.5], m2: [7.5, 9.0], recog: [9.0, 11.5], portrait: [11.5, 14.5], end: [14.5, 17.2] };
window.CUES = [];
const cue = (type, at, gain = 1) => window.CUES.push({ type, at: +at.toFixed(4), gain });
cue('type', .1, .35); cue('riser', 1.0, .8); cue('boom', 1.0, .9); cue('shutter', 1.0, .6);
SH.forEach((s, i) => {
  if (i === 0 || !s.src) return;
  ({ circle: () => cue('match', s.at), axis: () => cue('axis', s.at), horizon: () => cue('horizon', s.at),
     slit: () => { cue('reverse', s.at, .8); cue('boom', s.at, .8); cue('horizon', s.at, .6); },
     vp: () => { cue('zoom', s.at, 1); cue('boom', s.at + .1, .8); } }[s.tin] || (() => {}))();
});
cue('swish', 4.42, .6); cue('braam', T.beat, .9); cue('drop', T.beat, .6);
cue('pop', 9.38, .7); cue('gdraw', 9.42); cue('pop', 9.62, .6); cue('chime', 9.9, .7); cue('counter', 10.05, .7);
cue('swipe', T.swap1); cue('swipe', T.swap2); cue('whoosh', T.expand + .25, .8);
cue('match', T.portrait, 1.1); cue('shutter', T.portrait + .1, .7);
for (let i = 0; i < 4; i++) cue('strobe', T.recap + i * .125, .8 + i * .06);
cue('boom', T.end, 1.1); cue('braam', T.end, .9); cue('chime', T.end + .15, .5);

/* ───────────────────────── grain ───────────────────────── */
const grainFrames = []; { let sd = 9; const r = () => (sd = sd * 16807 % 2147483647) / 2147483647;
  const g = $('grain').getContext('2d'); for (let f = 0; f < 6; f++) { const id = g.createImageData(540, 960);
    for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - .5) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } grainFrames.push(id); } }

/* ───────────────────────── render ───────────────────────── */
function render(t) {
  FRAME = Math.floor(t * FPS + 1e-6);

  /* intro: title, then a white dot that becomes the iris */
  show('intro', t < 1.2);
  if (t < 1.2) {
    blurIn(iTitle, t, .08, .08, .45, .6, .22);
    const sub = E.outCubic(P(t, .25, .6)) * (1 - E.inCubic(P(t, .62, .8)));
    S('iSub', { o: sub, filter: `blur(${(1 - sub) * 10}px)` });
    const r = 225 * E.outExpo(P(t, .72, 1.02));
    S('iDot', { left: `${540 - r}px`, top: `${990 - r}px`, width: `${2 * r}px`, height: `${2 * r}px`, o: t < .72 ? 0 : 1 - smooth(1.02, 1.12, t) });
  }

  /* match-cut shots */
  show('shots', t < T.google);
  if (t < T.google) renderShots(t);

  /* type beat */
  show('beat', t >= T.beat && t < 5.5);
  if (t >= T.beat && t < 5.5) {
    blurIn(bA, t, 4.6, .06, .4, 5.22, .2);
    blurIn(bB, t, 4.72, .09, .5, 5.25, .2);
  }
  // horizon line that the beach shot opens from
  if (t >= 5.2 && t < 5.5) {
    const pl = placement(7, 5.5), y = pl.ty + SH[7].slitY * pl.s, w = W * E.inOutQuart(P(t, 5.25, 5.48));
    lineA.setAttribute('x1', 540 - w / 2); lineA.setAttribute('x2', 540 + w / 2); lineA.setAttribute('y1', y); lineA.setAttribute('y2', y);
    lineA.setAttribute('opacity', .9);
  }

  /* Google × photo */
  const gOn = t >= T.google && t < T.portrait;
  show('google', gOn);
  show('lightBg', t >= T.google && t < T.recap);
  if (gOn) {
    // card 0 starts exactly where the full-screen featured frame left off
    const pull = E.inOutQuart(P(t, T.google, T.google + .62));
    const s0 = .85 * 1.07, c0 = cardFit(960, 1205);
    cardEls.forEach((c, i) => {
      const [, fx, fy] = CARDS[i];
      let s, x, y, inset = [CARD.y, W - CARD.x - CARD.w, H - CARD.y - CARD.h, CARD.x], rad = CARD.r;
      const cf = cardFit(fx, fy);
      s = cf.s; x = cf.x; y = cf.y;
      if (i === 0) { s = lerpLog(s0, c0.s, pull); x = 540; y = lerp(959, c0.y, pull); inset = inset.map(v => v * pull); rad = CARD.r * pull; }
      if (i === 2) {
        const ex = E.inOutQuart(P(t, T.expand, T.portrait));
        s = lerpLog(cf.s, 1.2, ex); x = lerp(cf.x, 540, ex); y = lerp(cf.y, 960, ex); inset = inset.map(v => v * (1 - ex)); rad = CARD.r * (1 - ex);
      }
      // carousel: card i is centred during [in_i, out_i]
      const ins = [-1, T.swap1, T.swap2], outs = [T.swap1, T.swap2, 99];
      const pin = i === 0 ? 1 : E.inOutQuart(P(t, ins[i] - .05, ins[i] + .4));
      const pout = E.inOutQuart(P(t, outs[i] - .05, outs[i] + .4));
      const dx = (1 - pin) * 780 - pout * 780;
      const sc = lerp(.9, 1, pin) * lerp(1, .9, pout);
      const vis = (i === 0 || t > ins[i] - .06) && pout < 1;
      c.d.style.display = vis ? '' : 'none';
      c.d.style.zIndex = i;
      c.d.style.clipPath = `inset(${inset[0]}px ${inset[1]}px ${inset[2]}px ${inset[3]}px round ${rad}px)`;
      c.d.style.transform = `translateX(${dx}px) scale(${sc})`;
      c.d.style.transformOrigin = `540px ${CARD.y + CARD.h / 2}px`;
      c.d.style.boxShadow = 'none';
      c.img.style.transform = `translate(${x - fx * s}px,${y - fy * s}px) scale(${s})`;
    });
    // G draws itself with a sweeping conic mask, × and the copy blur in
    const gd = E.inOutCubic(P(t, 9.38, 9.92));
    const gm = `conic-gradient(from -90deg, #000 ${gd * 360}deg, transparent ${gd * 360 + .5}deg)`;
    setMask($('gMark'), gm);
    const gIn = E.outBack(P(t, 9.36, 9.9));
    const out = E.inCubic(P(t, T.expand - .1, T.expand + .2));
    S('gMark', { tf: `scale(${lerp(.7, 1, clamp(gIn, 0, 1.2))}) rotate(${lerp(-40, 0, gd)}deg) translateY(${-out * 40}px)`, o: (gd > 0 ? 1 : 0) * (1 - out) });
    const xi = E.outCubic(P(t, 9.6, 9.95));
    S('gX', { o: xi * (1 - out), filter: `blur(${(1 - xi) * 10 + out * 10}px)`, tf: `translateY(${-out * 30}px)` });
    blurIn(gL1, t, 9.8, .05, .45, T.expand - .1, .2);
    const l2 = E.outCubic(P(t, 9.9, 10.35));
    S('gL2', { o: l2 * (1 - out), filter: `blur(${(1 - l2) * 12 + out * 10}px)`, tf: `translateY(${(1 - l2) * 24}px)` });
    const l3 = E.outCubic(P(t, 10.05, 10.5));
    S('gL3', { o: l3 * (1 - out), filter: `blur(${(1 - l3) * 10 + out * 10}px)` });
    $('gNum').textContent = `${Math.round(300 * E.outQuart(P(t, 10.05, 10.75)))}K+`;
  }

  /* portrait: the ferris hub becomes his camera lens */
  const pOn = t >= T.portrait && t < T.recap;
  show('portrait', pOn);
  if (pOn) {
    const HUB = [1077, 1535], LENS = [383, 345];
    const drift = 1 + .04 * (t - T.portrait);
    $('pFerris').style.transform = `translate(${540 - HUB[0] * 1.2 * drift}px,${960 - HUB[1] * 1.2 * drift}px) scale(${1.2 * drift})`;
    S('pFerrisWrap', { o: 1 - smooth(11.62, 12.05, t) });
    const al = smooth(11.5, 11.68, t);
    const mv = E.inOutQuint(P(t, 11.6, 12.65));
    const cy = lerp(960, 760, mv), R = lerp(140, 410, mv), s = lerpLog(140 / 48, 1.45, mv);
    $('pImg').style.transform = `translate(${540 - LENS[0] * s}px,${cy - LENS[1] * s}px) scale(${s})`;
    setMask($('pWrap'), `radial-gradient(circle at 540px ${cy}px, rgba(0,0,0,${al}) ${R}px, rgba(0,0,0,0) ${R + 2}px)`);
    const rl = 2 * Math.PI * 434, rp = E.inOutQuart(P(t, 12.3, 13.0));
    $('pRing').setAttribute('stroke-dasharray', `${rl} ${rl}`); $('pRing').setAttribute('stroke-dashoffset', rl * (1 - rp));
    $('pBadge').setAttribute('transform', `rotate(${(t - T.portrait) * 18 - 40} 540 760)`);
    $('pBadge').style.opacity = smooth(12.5, 12.9, t);
    blurIn(pName, t, 12.55, .09, .55);
    blurIn(pRole, t, 12.85, .05, .5);
    const ex = E.inCubic(P(t, 14.2, 14.5));
    S('portrait', { o: 1 - ex, tf: `scale(${lerp(1, .97, ex)})` });
  }

  /* recap strobe */
  const rOn = t >= T.recap && t < T.end;
  show('recap', rOn);
  if (rOn) {
    const i = clamp(Math.floor((t - T.recap) / .125), 0, 3), lt = t - T.recap - i * .125;
    recapEls.forEach((r, j) => r.d.style.display = j === i ? '' : 'none');
    const r = recapEls[i]; cover(r.img, lerp(1.12, 1.02, E.outExpo(lt / .125)), r.fx, r.fy);
  }

  /* end card */
  show('end', t >= T.end);
  if (t >= T.end) {
    blurIn(eTitle, t, T.end + .05, .1, .6);
    const a = E.outCubic(P(t, 15.35, 15.8)), b = E.outCubic(P(t, 15.55, 16.0));
    S('eSub', { o: a, filter: `blur(${(1 - a) * 10}px)` });
    S('eUrl', { o: b, filter: `blur(${(1 - b) * 10}px)` });
    S('end', { o: 1 - smooth(16.75, 17.2, t), tf: `scale(${lerp(1, 1.03, P(t, T.end, 17.2))})` });
  }

  /* eyebrow + per-shot word */
  const montage = (t >= 1.0 && t < T.beat) || (t >= 5.5 && t < T.google);
  S('eyebrow', { o: montage ? smooth(1.0, 1.3, t) * (1 - smooth(4.3, 4.5, t)) + (t >= 5.5 ? smooth(5.6, 5.9, t) * (1 - smooth(8.7, 8.95, t)) : 0) : 0 });
  let c = -1; for (let i = 0; i < SH.length; i++) if (t >= SH[i].at) c = i;
  const wEl = $('word');
  if (montage && c >= 0 && SH[c].word) {
    const s = SH[c], n = SH[c + 1];
    if (wEl.textContent !== s.word) wEl.textContent = s.word;
    const pin = E.outCubic(P(t, s.at + .04, s.at + .3)), pout = E.inCubic(P(t, n.at - .14, n.at - .02));
    S(wEl, { o: pin * (1 - pout), filter: `blur(${(1 - pin) * 14 + pout * 14}px)`, tf: `translateY(${(1 - pin) * 18}px) scale(${lerp(1.05, 1, pin)})` });
  } else S(wEl, { o: 0 });

  S('vig', { o: (t >= 1 && t < T.beat) || (t >= 5.5 && t < T.google) || (t >= T.recap && t < T.end) ? 1 : 0 });
  $('grain').getContext('2d').putImageData(grainFrames[FRAME % grainFrames.length], 0, 0);
}

/* coverage self-check: every visible photo must fill the frame */
window.checkCoverage = () => {
  const bad = [];
  for (let f = 0; f < window.DURATION * FPS; f += 2) {
    const t = f / FPS;
    SH.forEach((s, i) => {
      const [D, a] = TR[s.tin] || [0, 0], n = SH[i + 1], [Dn, an] = n ? (TR[n.tin] || [0, 0]) : [0, 0];
      const from = s.at - D * a + D * .6, to = n ? n.at + Dn * (1 - an) : 99;   // span where the shot is (almost) unmasked
      if (!s.src || t < from || t > to) return;
      const pl = placement(i, t), img = shotEls[i].img;
      const x0 = pl.tx, y0 = pl.ty, x1 = x0 + img.naturalWidth * pl.s, y1 = y0 + img.naturalHeight * pl.s;
      if (x0 > .5 || y0 > .5 || x1 < W - .5 || y1 < H - .5) bad.push(`${t.toFixed(2)} ${s.src} [${x0.toFixed(0)},${y0.toFixed(0)},${x1.toFixed(0)},${y1.toFixed(0)}] s=${pl.s.toFixed(2)}`);
    });
  }
  return bad;
};

window.seek = t => render(t);
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  render(0); return true;
})();
const params = new URLSearchParams(location.search);
if (!params.has('render')) {
  document.body.classList.add('preview');
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); $('stage').style.transform = `scale(${k})`; $('stage').style.marginRight = `${W * (k - 1)}px`; $('stage').style.marginBottom = `${H * (k - 1)}px`; };
  addEventListener('resize', fit); fit();
  window.ready.then(() => {
    if (params.has('t')) { render(+params.get('t')); return; }
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % window.DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
